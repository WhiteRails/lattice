[workspace]
resolver = "2"
members = [
  "lattice-net-core",
  "lattice-netd",
  "lattice-gatewayd",
  "lattice-resolver",
  "lattice-netctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2.0", features = ["pem", "pkcs8", "rand_core"] }
ipnet = { version = "2.12.1", features = ["serde"] }
pkcs8 = { version = "0.10.2", features = ["pem"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8.5"
rcgen = { version = "0.14.9", features = ["x509-parser"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
time = "0.3.55"
tun-rs = { version = "2.8.8", features = ["async_tokio"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
x509-parser = "0.18.1"
