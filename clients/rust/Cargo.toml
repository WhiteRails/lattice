[package]
name = "lattice-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust client for the native Lattice daemon IPC protocol"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
hmac = "0.12.1"
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.8"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[lib]
name = "lattice_client"
path = "src/lib.rs"

[[bin]]
name = "lattice"
path = "src/main.rs"

[[bin]]
name = "lt"
path = "src/lt.rs"
