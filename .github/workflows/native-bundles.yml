name: Native bundles

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable, resolved 2026-08-24
        with:
          toolchain: stable

      - name: Install OpenSSL development headers
        run: sudo apt-get update && sudo apt-get install --yes libssl-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build native distribution
        run: npm run package:bundle

      - name: Upload native bundle and checksum
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: lattice-linux-x86_64
          path: artifacts/*
          if-no-files-found: error
