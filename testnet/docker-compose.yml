name: lattice-testnet

services:
  overlay:
    build:
      context: ..
      dockerfile: testnet/Dockerfile
    image: lattice-testnet:local
    command:
      - /bin/sh
      - -ec
      - >-
        node dist/cli/lattice.js init && node dist/cli/lattice.js node init
        --entry-bind 0.0.0.0:7777 && exec node dist/cli/lattice.js up
        --service lp://echo.lattice --target http://echo-service:9001
    ports:
      - "127.0.0.1:7777:7777"
    environment:
      LATTICE_HOME: /tmp/lattice
      LATTICE_REPLAY_REDIS_URL: redis://replay:6379/0
      LATTICE_OVERLAY_MAX_INFLIGHT: "4096"
      LATTICE_OVERLAY_MAX_INFLIGHT_PER_PEER: "128"
      LATTICE_OVERLAY_MAX_INFLIGHT_BYTES: "67108864"
      LATTICE_OVERLAY_MAX_INFLIGHT_PER_PEER_BYTES: "8388608"
    depends_on:
      replay:
        condition: service_healthy
      echo-service:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp/lattice:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7777/', r => process.exit(r.statusCode === 401 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - lattice-overlay

  echo-service:
    image: lattice-testnet:local
    command: ["node", "dist/services/echo/index.js"]
    environment:
      LATTICE_SERVICE_BIND_HOST: 0.0.0.0
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    networks:
      - lattice-overlay

  # Local-only test dependency. Production cells require a TLS-authenticated
  # Redis or Valkey deployment managed outside this compose file.
  replay:
    image: redis@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    user: "999:1000"
    read_only: true
    tmpfs:
      - /data:uid=999,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lattice-overlay

networks:
  lattice-overlay:
    driver: bridge
